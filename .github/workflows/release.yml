name: Release

# On every push to master (normally the develop -> master merge), analyse
# conventional-commit messages, bump the version, tag it (v-prefixed), update
# CHANGELOG.md, and publish a GitHub Release.
# The published Release fires satis-publish.yml, which rebuilds packages.square360.com.
on:
  push:
    branches:
      - master
      - 8.x

jobs:
  semantic_release:
    uses: Square360/shared-workflows/.github/workflows/reusable-semantic-release.yml@v4  # moving major tag — advances with each 4.x release
    with:
      release_branches: '["master", "8.x"]'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
